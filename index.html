<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجموعة مراكز الصخرة التعليمية | منظومة الإدارة المركزية المتكاملة (ERP)</title>
  <link rel="icon" type="image/jpeg" href="./logo.jpg">
  
  <!-- خط Cairo المعتمد للغة العربية والتصميم الحديث -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'sans-serif'],
          },
          colors: {
            sakhra: {
              navy: '#0B2D5C',      // اللون الكحلي الرسمي لمجموعة الصخرة
              navyLight: '#143d75',
              navyDark: '#071f40',
              gold: '#D4A017',      // اللون الذهبي الأكاديمي الرسمي
              goldLight: '#eab32a',
              goldDark: '#b5850e',
              slate: '#1e293b',
              grayBg: '#f8fafc',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- React 18 & Babel for seamless in-browser execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- ERP Dataset -->
  <script src="./mockData.js"></script>

  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Animation effects */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.25s ease-out forwards;
    }
    
    .table-row-hover {
      transition: all 0.15s ease-in-out;
    }
    .table-row-hover:hover {
      background-color: #f8fafc;
    }

    /* طباعة نظيفة للجداول والتقارير */
    @media print {
      header, aside, .no-print, button, .fab-btn {
        display: none !important;
      }
      body {
        background: white !important;
      }
      main {
        padding: 0 !important;
        margin: 0 !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 antialiased text-slate-800">
  <div id="root">
    <div class="min-h-screen flex items-center justify-center bg-slate-50">
      <div class="text-center p-8">
        <div class="relative w-24 h-24 mx-auto mb-4">
          <div class="absolute inset-0 border-4 border-[#D4A017] border-t-transparent rounded-full animate-spin"></div>
          <img src="./logo.jpg" alt="شعار مجموعة مراكز الصخرة" class="w-20 h-20 rounded-full object-contain p-1 absolute inset-2 bg-white shadow-md">
        </div>
        <p class="text-base font-black text-[#0B2D5C]">جاري تحميل منظومة الصخرة التعليمية المتكاملة (ERP)...</p>
        <p class="text-xs text-slate-400 mt-1">تهيئة الفروع السبعة ونظام الصلاحيات المتعددة</p>
      </div>
    </div>
  </div>

  <!-- Main Application Script -->
  <script type="text/babel" src="./app.jsx"></script>
</body>
</html>
